name: 项目孵化申请
description: 申请将暂未归属专题的开源项目纳入 HQU-AIot 组织孵化
title: "[项目申请] "
labels:
  - project-application
body:
  - type: markdown
    attributes:
      value: |
        请完整填写申请信息。提交前请确认代码来源清晰，且不含密钥或个人敏感信息。
  - type: input
    id: project_name
    attributes:
      label: 项目名称
      placeholder: 例如：智能温室监测系统
    validations:
      required: true
  - type: input
    id: repo_name
    attributes:
      label: 建议仓库名
      description: 建议使用小写英文和连字符。
      placeholder: smart-greenhouse
    validations:
      required: true
  - type: input
    id: maintainer
    attributes:
      label: 项目负责人 GitHub 用户名
      placeholder: username
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 项目简介与目标
      description: 说明要解决的问题、主要功能和预期成果。
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: 技术方向
      options:
        - 硬件
        - 通信与物联网
        - AI 视觉及算法
        - 机械
        - 跨方向
        - 其他
    validations:
      required: true
  - type: dropdown
    id: maturity
    attributes:
      label: 当前阶段
      options:
        - 构思与需求分析
        - 原型开发
        - 可运行版本
        - 持续维护
    validations:
      required: true
  - type: dropdown
    id: repository_source
    attributes:
      label: 仓库来源
      options:
        - 申请新建组织仓库
        - 将现有个人仓库转移至组织
    validations:
      required: true
  - type: input
    id: existing_repo
    attributes:
      label: 现有仓库链接（如适用）
      placeholder: https://github.com/username/repository
  - type: dropdown
    id: license
    attributes:
      label: 拟采用的开源许可证
      options:
        - MIT
        - Apache-2.0
        - GPL-3.0
        - LGPL-3.0
        - BSD-3-Clause
        - CERN-OHL-S-2.0（硬件）
        - 尚未确定，需要建议
        - 其他
    validations:
      required: true
  - type: textarea
    id: collaborators
    attributes:
      label: 预期协作者
      description: 可填写 GitHub 用户名；暂未确定可写“暂无”。
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: 申请确认
      options:
        - label: 我确认有权公开提交的代码、文档和其他材料，并会遵守第三方许可证要求。
          required: true
        - label: 我确认项目中不包含令牌、密码、私钥、设备凭证或个人敏感信息。
          required: true
        - label: 我了解项目将公开展示，且每个项目需在独立仓库中声明自己的许可证。
          required: true
